name: Deploy GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: 
      - main
    paths-ignore: 
      - "Bluehill.Hangul.Tests/**"
      - "Bluehill.Hangul.Pages.Tests/**"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: ${{ runner.os }}-pages-nuget-${{ hashFiles('global.json', 'Directory.Packages.props') }} #hash of project files
          restore-keys: ${{ runner.os }}-pages-nuget-
      - name: Prepare Blazor WASM for GitHub Pages
        uses: na1307/blazor-github-pages@v4
        id: prepare
        with:
          project-path: Bluehill.Hangul.Pages/Bluehill.Hangul.Pages.csproj
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.prepare.outputs.wwwroot-path }}

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
